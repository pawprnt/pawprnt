<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pawprntos</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="pawprntos">
  <meta property="og:description" content="a browser-based os simulation with a terminal, file browser, wiki viewer, and more.">
  <meta property="og:url" content="https://pawprnt.pages.dev">
  <meta property="og:image" content="static/favicons/favicon-32.png">
  <meta name="theme-color" content="#0e0e12">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="static/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="static/favicons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="static/favicons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="static/favicons/apple-touch-icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="static/css/core/base.css">
  <link rel="stylesheet" href="static/css/core/boot.css">
  <link rel="stylesheet" href="static/css/core/wm.css">
  <link rel="stylesheet" href="static/css/core/taskbar.css">
  <link rel="stylesheet" href="static/css/apps/terminal.css">
  <link rel="stylesheet" href="static/css/apps/files.css">
  <link rel="stylesheet" href="static/css/apps/viewer.css">
  <link rel="stylesheet" href="static/css/apps/about.css">
  <link rel="stylesheet" href="static/css/apps/wiki.css">
  <link rel="stylesheet" href="static/css/apps/settings.css">

  <!-- Cloudflare Web Analytics -->
  <script defer data-cf-beacon='{"token":"43d4379018a3422ca0545db123e62faf"}' src="https://static.cloudflareinsights.com/beacon.min.js"></script>
</head>
<body>
  <div id="boot">
    <div class="boot-logo">pawprntos<span class="cursor">&#9612;</span></div>
    <div class="boot-bar"><div class="boot-fill"></div></div>
    <div class="boot-log"></div>
  </div>

  <main id="desktop" hidden>
    <div id="wallpaper"></div>
    <div id="windows"></div>
    <div id="taskbar"></div>
  </main>

  <!-- Mobile gate. Runs before any app script so the OS never initialises on a
       phone: the flag is set here, #desktop is hidden, and main.js bails. -->
  <script>
    window.PAWPRNTOS_BLOCKED =
      window.matchMedia("(max-width: 768px)").matches ||
      /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (window.PAWPRNTOS_BLOCKED) {
      document.addEventListener("DOMContentLoaded", function () {
        var boot = document.getElementById("boot");
        if (boot) {
          boot.innerHTML =
            '<div style="position:absolute;inset:0;display:flex;align-items:center;' +
            "justify-content:center;font-family:monospace;font-size:1.2rem;color:#888;" +
            'text-align:center;padding:40px;line-height:1.6;">pawprntos is not ' +
            "supported on mobile yet.<br>please visit on a desktop browser.</div>";
        }
        var desktop = document.getElementById("desktop");
        if (desktop) desktop.remove();
      });
    }
  </script>

  <!-- Scripts (defer = parallel download, execute in order after DOM parse) -->
  <script defer src="static/js/core/filesystem.js"></script>
  <script defer src="static/js/core/helpers.js"></script>
  <script defer src="static/js/core/boot.js"></script>
  <script defer src="static/js/core/wm.js"></script>
  <script type="module" src="static/js/apps/terminal/index.js"></script>
  <script defer src="static/js/apps/repos.js"></script>
  <script defer src="static/js/apps/files/admin.js"></script>
  <script defer src="static/js/apps/files/index.js"></script>
  <script defer src="static/js/core/wallpapers.js"></script>
  <script defer src="static/js/core/taskbar.js"></script>
  <script defer src="static/js/core/settings.js"></script>
  <script defer src="static/js/apps/about/lyrics.js"></script>
  <script defer src="static/js/apps/about/index.js"></script>
  <script defer src="static/js/apps/settings/index.js"></script>
  <script defer src="static/js/apps/registry.js"></script>
  <script defer src="static/js/core/main.js"></script>
</body>
</html>
